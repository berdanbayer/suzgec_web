<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum - Süzgeç</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="bg-[#0b1d2d] text-white min-h-screen flex items-center justify-center">

    <div class="bg-[#1a2b3c] p-8 rounded-2xl shadow-2xl border border-[#38485a] w-full max-w-md transform transition-all">
        <div class="text-center mb-6">
            <span class="material-symbols-outlined text-[56px] text-blue-500 mb-2">lock_reset</span>
            <h2 class="text-2xl font-bold">Şifrenizi mi Unuttunuz?</h2>
            <p class="text-gray-400 mt-2 text-sm">Hesabınıza bağlı e-posta adresini girin, size bir sıfırlama bağlantısı gönderelim.</p>
        </div>

        <form method="POST" action="">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-6">
                <label class="block text-sm font-bold mb-2 text-gray-300">E-posta Adresi</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-3 rounded-lg bg-[#0b1d2d] border border-[#38485a] text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
            </div>

            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 font-bold rounded-lg transition shadow-lg shadow-blue-900/50">
                Sıfırlama Bağlantısı Gönder
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('login') }}" class="text-sm text-blue-400 hover:text-blue-300 hover:underline transition">Giriş Ekranına Dön</a>
        </div>
    </div>

</body>
</html>
