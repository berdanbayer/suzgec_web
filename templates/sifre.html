<!DOCTYPE html>
<html class="light" lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Süzgeç - Şifre Değiştir</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#fbf9fa", "surface-container": "#efedef", "on-secondary-fixed-variant": "#3b4951", "tertiary-container": "#38260b", "on-tertiary-fixed-variant": "#584326", "on-primary-fixed": "#0b1d2d", "primary-fixed": "#d2e4fb", "on-tertiary-container": "#a88c69", "on-tertiary": "#ffffff", "tertiary": "#211200", "outline": "#74777d", "on-surface": "#1b1c1d", "surface-container-lowest": "#ffffff", "inverse-surface": "#303032", "surface-dim": "#dbd9db", "secondary-fixed": "#d6e5ef", "tertiary-fixed-dim": "#e1c29b", "on-background": "#1b1c1d", "surface-variant": "#e4e2e3", "secondary-fixed-dim": "#bac9d3", "on-secondary-fixed": "#0f1d25", "on-secondary-container": "#56656e", "on-error-container": "#93000a", "error": "#ba1a1a", "secondary-container": "#d3e2ed", "on-primary": "#ffffff", "primary-container": "#1a2b3c", "on-tertiary-fixed": "#281802", "surface-tint": "#4f6073", "error-container": "#ffdad6", "on-primary-fixed-variant": "#38485a", "inverse-primary": "#b7c8de", "surface-container-highest": "#e4e2e3", "on-secondary": "#ffffff", "on-error": "#ffffff", "on-primary-container": "#8192a7", "on-surface-variant": "#44474c", "inverse-on-surface": "#f2f0f2", "tertiary-fixed": "#feddb5", "primary-fixed-dim": "#b7c8de", "surface-container-low": "#f5f3f4", "primary": "#041627", "surface-container-high": "#e9e7e9", "surface-bright": "#fbf9fa", "secondary": "#526069", "outline-variant": "#c4c6cd", "background": "#fbf9fa"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": { "md": "24px", "base": "8px", "xl": "80px", "margin": "32px", "lg": "48px", "sm": "12px", "xs": "4px", "gutter": "24px" },
                    "fontFamily": { "label-bold": ["Manrope"], "h2": ["Manrope"], "h1": ["Manrope"], "caption": ["Manrope"], "h3": ["Manrope"], "body-md": ["Manrope"], "body-lg": ["Manrope"] }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex items-center justify-center font-body-md">
    
    <header class="absolute top-0 left-0 w-full px-margin py-md flex justify-start items-center z-50">
        <div class="text-h3 font-h3 text-primary">Süzgeç</div>
    </header>

    <main class="w-full max-w-[1200px] min-h-[80vh] flex flex-col md:flex-row bg-surface-container-lowest shadow-sm rounded-xl overflow-hidden mx-margin my-xl border border-surface-container-highest">
        <section class="hidden md:flex flex-col w-1/2 bg-surface-container-low p-xl justify-center relative overflow-hidden">
            <div class="z-10 max-w-md">
                <h1 class="text-h1 font-h1 text-primary mb-md">Güvenliğinizi Güncel Tutun</h1>
                <p class="text-body-lg font-body-lg text-on-surface-variant">Hesabınızın güvenliği için güçlü ve benzersiz bir şifre belirleyin.</p>
            </div>
            <div class="mt-lg z-10 w-full max-w-[400px] aspect-square rounded-full flex items-center justify-center bg-gradient-to-br from-surface-container to-surface-container-highest shadow-inner opacity-80">
                <img alt="" class="w-[80%] h-[80%] object-cover rounded-full mix-blend-multiply opacity-50 grayscale contrast-125" src="https://lh3.googleusercontent.com/aida/ADBb0ugI03nS63LSgr4EzWpVPej5qURRuOlYBJ4T1ltoF7daTvgRxCggoLdouJM6q07U-YnAzC7KyUkcCgNoX-TMa9ELEdfrwUcU8abEcSKDXror7OtCPPTXdHau16ZzvlUIhNQ_L7sU1ZGaaRO1s0g5Po1pfVpReZkKPZBGPLaGyFJQdAwjcx60YiEMjrFg1Nt-YLR9C3z55GeeHpGv1iHQ24TObpjDuxn6zzAqpftWw-5pAEaBvGMHvDystQ"/>
            </div>
            <div class="absolute top-0 right-0 -mt-20 -mr-20 w-96 h-96 bg-primary-fixed rounded-full blur-3xl opacity-20"></div>
            <div class="absolute bottom-0 left-0 -mb-20 -ml-20 w-80 h-80 bg-secondary-fixed rounded-full blur-3xl opacity-30"></div>
        </section>

        <section class="w-full md:w-1/2 p-margin md:p-xl flex flex-col justify-center items-center bg-surface-container-lowest">
            <div class="w-full max-w-sm">
                <h2 class="text-h2 font-h2 text-on-surface mb-xl text-center md:text-left">Şifre Değiştir</h2>
                
                <form class="space-y-md flex flex-col" method="POST" action="/sifre">
                    <div class="flex flex-col gap-xs">
                        <label class="text-label-bold font-label-bold text-on-surface" for="current-password">Mevcut Şifre</label>
                        <div class="relative">
                            <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-sm py-sm text-body-md font-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-sm placeholder:text-on-surface-variant" id="current-password" name="current_password" placeholder="••••••••" required="" type="password"/>
                            <span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer" data-icon="visibility_off">visibility_off</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-xs">
                        <label class="text-label-bold font-label-bold text-on-surface" for="new-password">Yeni Şifre</label>
                        <div class="relative">
                            <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-sm py-sm text-body-md font-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-sm placeholder:text-on-surface-variant" id="new-password" name="new_password" placeholder="••••••••" required="" type="password"/>
                            <span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer" data-icon="visibility_off">visibility_off</span>
                        </div>
                        <div class="flex gap-xs mt-1">
                            <div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
                            <div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
                            <div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
                            <div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
                        </div>
                        <p class="text-caption font-caption text-on-surface-variant mt-1 text-right">Güçlü bir şifre girin</p>
                    </div>
                    
                    <div class="flex flex-col gap-xs">
                        <label class="text-label-bold font-label-bold text-on-surface" for="confirm-password">Yeni Şifre (Tekrar)</label>
                        <div class="relative">
                            <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-sm py-sm text-body-md font-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-sm placeholder:text-on-surface-variant" id="confirm-password" name="new_password_confirm" placeholder="••••••••" required="" type="password"/>
                            <span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer" data-icon="visibility_off">visibility_off</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-sm pt-md mt-sm border-t border-surface-container-highest">
                        <button class="w-full bg-primary-container hover:bg-primary text-on-primary font-label-bold text-label-bold py-sm px-md rounded-lg shadow-sm hover:shadow-md transition-all duration-200 flex justify-center items-center" type="submit">
                            Şifreyi Güncelle
                        </button>
                        <a class="w-full text-center text-primary-container hover:text-primary font-label-bold text-label-bold py-sm px-md rounded-lg hover:bg-surface-container-low transition-colors duration-200" 
   href="{{ url_for('logout') }}">
    Vazgeç
</a>
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script>
    // Şifre göster/gizle fonksiyonu
    document.querySelectorAll('.material-symbols-outlined[data-icon]').forEach(icon => {
        icon.addEventListener('click', function() {
            const input = this.previousElementSibling; // İkonun hemen yanındaki inputu bul
            
            if (input.type === 'password') {
                input.type = 'text';
                this.innerText = 'visibility'; // İkonu değiştir
            } else {
                input.type = 'password';
                this.innerText = 'visibility_off'; // İkonu eski haline getir
            }
        });
    });

    // Şifre gücü göstergesi (Basit bir kontrol)
    const newPasswordInput = document.getElementById('new-password');
    const strengthBars = document.querySelectorAll('.h-1.flex-1');

    newPasswordInput.addEventListener('input', function() {
        const val = this.value;
        // Her 2 karakterde bir barı renklendir
        strengthBars.forEach((bar, index) => {
            if (val.length > (index * 2) + 2) {
                bar.classList.remove('bg-surface-container-high');
                bar.classList.add('bg-primary'); // Güçlüyse ana rengini al
            } else {
                bar.classList.remove('bg-primary');
                bar.classList.add('bg-surface-container-high');
            }
        });
    });
</script>
<script>
    // Tarayıcı geçmişinde yeni bir durak oluştur
    history.pushState(null, null, location.href);

    // Geri tuşuna basıldığında tetiklenir
    window.onpopstate = function () {
        // Kullanıcıyı logout rotasına göndererek oturumu sonlandır
        window.location.href = "{{ url_for('logout') }}";
    };
</script>
<script>
    // Sayfanın geri tuşu ile tekrar yüklenmesini engelle
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            // Eğer sayfa bellekten (cache) geliyorsa yenile
            window.location.reload();
        }
    });

    // Geri tuşuna basıldığında oturumu kapat ve login'e yönlendir
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
        window.location.replace("{{ url_for('logout') }}");
    };
</script>
</body>
</html>
