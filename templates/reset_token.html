<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Şifre Belirle - Süzgeç</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="bg-[#0b1d2d] text-white min-h-screen flex items-center justify-center">

    <div class="bg-[#1a2b3c] p-8 rounded-2xl shadow-2xl border border-[#38485a] w-full max-w-md transform transition-all">
        <div class="text-center mb-6">
            <span class="material-symbols-outlined text-[56px] text-green-500 mb-2">vpn_key</span>
            <h2 class="text-2xl font-bold">Yeni Şifre Belirle</h2>
            <p class="text-gray-400 mt-2 text-sm">Lütfen yeni şifrenizi girin. Hesabınızın güvenliği için güçlü bir şifre seçin.</p>
        </div>

        <form method="POST" action="">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-2 text-gray-300">Yeni Şifre</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-3 rounded-lg bg-[#0b1d2d] border border-[#38485a] text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition">
            </div>

            <div class="mb-8">
                <label class="block text-sm font-bold mb-2 text-gray-300">Yeni Şifre (Tekrar)</label>
                <input type="password" name="password_confirm" required
                       class="w-full px-4 py-3 rounded-lg bg-[#0b1d2d] border border-[#38485a] text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition">
            </div>

            <button type="submit" class="w-full py-3 bg-green-600 hover:bg-green-700 font-bold rounded-lg transition shadow-lg shadow-green-900/50">
                Şifremi Güncelle
            </button>
        </form>
        
    </div>

</body>
</html>
