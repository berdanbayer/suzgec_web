<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Süzgeç - Kayıt Ol</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#44474c",

                        "on-secondary": "#ffffff",
                        "inverse-primary": "#b7c8de",
                        "surface-tint": "#4f6073",
                        "on-surface": "#1b1c1d",

                        "error": "#ba1a1a",
                        "surface-container-highest": "#e4e2e3",
                        "on-tertiary-container": "#a88c69",
                        "primary-container": "#1a2b3c",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c4c6cd",
                        "surface-variant": "#e4e2e3",
                        "on-secondary-fixed-variant": "#3b4951",
                        "surface-container": "#efedef",
                        "primary-fixed": "#d2e4fb",
                        "tertiary": "#211200",
                        "inverse-on-surface": "#f2f0f2",

                        "on-primary": "#ffffff",

                        "tertiary-fixed": "#feddb5",
                        "on-tertiary-fixed": "#281802",
                        "on-secondary-container": "#56656e",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "surface-dim": "#dbd9db",
                        "tertiary-fixed-dim": "#e1c29b",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#0f1d25",
                        "primary": "#041627",
                        "secondary-container": "#d3e2ed",
                        "surface": "#fbf9fa",
                        "on-tertiary-fixed-variant": "#584326",
                        "background": "#fbf9fa",
                        "secondary-fixed-dim": "#bac9d3",
                        "tertiary-container": "#38260b",
                        "secondary-fixed": "#d6e5ef",
                        "on-primary-fixed-variant": "#38485a",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#b7c8de",
                        "secondary": "#526069",
                        "inverse-surface": "#303032",
                        "on-primary-fixed": "#0b1d2d",
                        "surface-bright": "#fbf9fa",
                        "outline": "#74777d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "xl": "80px",
                        "lg": "48px",
                        "sm": "12px",
                        "base": "8px",
                        "md": "24px",
                        "xs": "4px",
                        "gutter": "24px",
                        "margin": "32px"
                    },
                    "fontFamily": {
                        "h3": ["Manrope"],
                        "h2": ["Manrope"],
                        "h1": ["Manrope"],
                        "caption": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "body-md": ["Manrope"],
                        "label-bold": ["Manrope"]
                    },
                    "fontSize": {
                        "h3": ["24px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600" }],

                        "label-bold": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }]

                }
            }
        }
    </script>
    <style>
        .custom-shadow {
            box-shadow: 0 20px 40px -10px rgba(26, 43, 60, 0.08);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex antialiased selection:bg-primary-fixed selection:text-primary">
    
    <div class="hidden lg:flex lg:w-1/2 bg-surface-container-low flex-col justify-between p-margin border-r border-outline-variant/30">
        <div class="font-h2 text-h2 text-primary tracking-tight">
            Süzgeç
        </div>
        <div class="flex flex-col max-w-lg mx-auto w-full justify-center flex-grow">
            <div class="w-full aspect-[4/3] rounded-lg overflow-hidden mb-lg shadow-[0_4px_24px_rgba(26,43,60,0.06)] bg-surface-container-highest">
                <img alt="Productivity Illustration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDn3aSvSOPHJC2PtE5Gm0fLOoJ59WonYaTLeAZq3-Oi7FlSn0edpB23F5zI9owUJPwZIwnGV231vCyvsyvqS8OXy4f_avEIaoFPmVK8lz9oH4U2csdcatkGZVoU83n8hRrnCvrK_KleZ21e07GRO4YRralZFB_V9HFebWy7WHpMqet1-rWWw7606wZzww5ExI7zCc186Wm3UG9IRDNgV2tUtnpUOco7Z180y5hg3fRzW07e7ubAXmz9I8qQ3a4o_eEhJQ1Jdved_aY"/>
            </div>
            <h1 class="font-h1 text-h1 text-primary mb-sm">
                Daha Verimli Bir Hayata İlk Adımı Atın
            </h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant">
                Hemen ücretsiz bir hesap oluşturun ve alışkanlıklarınızı süzgeçten geçirmeye başlayın.
            </p>
        </div>
        <div></div>
    </div>

    <div class="w-full lg:w-1/2 bg-surface-container-lowest flex items-center justify-center p-margin">
        <div class="absolute top-margin left-margin lg:hidden font-h2 text-h2 text-primary tracking-tight">
            Süzgeç
        </div>
        
        <div class="w-full max-w-[420px] bg-surface-container-lowest rounded-lg custom-shadow border border-surface-container-high p-lg">
            <h2 class="font-h2 text-h2 text-primary text-center mb-lg">
                Kayıt Ol
            </h2>
            
            <form method="POST" action="" class="flex flex-col gap-md">
                {{ form.hidden_tag() }}
                
                <div class="flex flex-col gap-xs">
                    <label for="fullName" class="font-label-bold text-label-bold text-primary">Ad Soyad</label>
                    <input type="text" id="fullName" name="fullname" placeholder="Ahmet Yılmaz" required class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/50"/>
                </div>
                
                <div class="flex flex-col gap-xs">
                    <label for="email" class="font-label-bold text-label-bold text-primary">E-posta</label>
                    <input type="email" id="email" name="email" placeholder="ornek@posta.com" required class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/50"/>
                </div>
                
                <div class="flex flex-col gap-xs">
                    <label for="password" class="font-label-bold text-label-bold text-primary">Şifre</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/50"/>
                </div>
                
                <div class="flex flex-col gap-xs">
                    <label for="passwordConfirm" class="font-label-bold text-label-bold text-primary">Şifre (Tekrar)</label>
                    <input type="password" id="passwordConfirm" name="confirm_password" placeholder="••••••••" required class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/50"/>
                </div>
                
                <button type="submit" class="w-full mt-sm py-4 bg-primary text-on-primary rounded-lg font-label-bold text-label-bold hover:bg-primary-container hover:shadow-md transition-all active:scale-[0.98]">
                    Hesap Oluştur
                </button>
            </form>

            <div class="mt-lg text-center font-body-md text-body-md text-on-surface-variant">
                Zaten hesabınız var mı? 
                <a class="text-primary font-label-bold hover:text-primary-container transition-colors ml-xs" href="{{ url_for('login') }}">
                    Giriş Yapın
                </a>
            </div>
        </div>
    </div>
</body>
</html>
